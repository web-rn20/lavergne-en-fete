# Politique RN20 (2026-09-14, revue) : depot peu actif, une PR securite groupee des qu'une faille sort.
# Aucune mise a jour de version (quota GitHub Actions).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: monthly
      timezone: Europe/Paris
    # Depot peu actif : correctifs de securite seulement, aucune mise a jour de version.
    open-pull-requests-limit: 0
    groups:
      securite:
        applies-to: security-updates
        patterns: ["*"]
